
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hira Adhikari</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#000;color:#fff}
header{
position:fixed;
top:0;
width:100%;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.45);
backdrop-filter:blur(15px);
z-index:1000;
}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:34px;color:#d90429}
.logo span{font-size:28px;font-weight:bold}
nav{display:flex;gap:25px}
nav a{color:white;text-decoration:none}
nav a:hover{color:#e50914}
.right{display:flex;align-items:center;gap:15px}
.icon{
width:42px;height:42px;
border-radius:50%;
display:flex;justify-content:center;align-items:center;
background:#111;cursor:pointer;
}
.btn{
background:#d90429;
padding:12px 24px;
border-radius:30px;
color:white;
text-decoration:none;
font-weight:bold;
}
.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=2000&auto=format&fit=crop') center/cover;
position:relative;
display:flex;
align-items:center;
padding:0 7%;
}
.hero::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to right,rgba(0,0,0,.8),rgba(0,0,0,.25));
}
.content{position:relative;max-width:650px}
.content small{
letter-spacing:5px;
font-size:18px;
color:#ccc;
}
.content h2{
font-size:88px;
line-height:1;
}
.content h2 span{color:#d90429}
.content h3{
font-size:32px;
margin:20px 0;
}
.content p{
font-size:22px;
line-height:1.7;
color:#ddd;
}
.buttons{
display:flex;
gap:20px;
margin-top:35px;
flex-wrap:wrap;
}
.ghost{
border:2px solid white;
padding:12px 26px;
border-radius:35px;
color:white;
text-decoration:none;
}
.social{
position:absolute;
right:25px;
top:50%;
transform:translateY(-50%);
display:flex;
flex-direction:column;
gap:18px;
z-index:5;
}
.social i{font-size:22px}
@media(max-width:900px){
header{padding:18px}
nav{display:none}
.content h2{font-size:62px}
.content h3{font-size:22px}
.content p{font-size:18px}
}
</style>
</head>
<body>

<header>
<div class="logo">
<h1>H</h1><span>HIRA ADHIKARI</span>
</div>

<nav>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#articles">Articles</a>
<a href="#gallery">Gallery</a>
<a href="#projects">Projects</a>
<a href="#contact">Contact</a>
</nav>

<div class="right">
<div class="icon"><i class="fas fa-search"></i></div>
<div class="icon"><i class="fas fa-moon"></i></div>
<a href="#contact" class="btn">Let's Talk →</a>
</div>
</header>

<section class="hero" id="home">

<div class="social">
<i class="fab fa-facebook"></i>
<i class="fab fa-instagram"></i>
<i class="fab fa-youtube"></i>
<i class="fab fa-tiktok"></i>
<i class="fab fa-linkedin"></i>
</div>

<div class="content">
<small>HELLO, I'M</small>
<h2>HIRA <span>ADHIKARI</span></h2>
<h3>Writer • Creator • Digital Strategist</h3>
<p>शब्द, विचार र प्रविधिबाट समाजलाई सकारात्मक यात्रामा...</p>

<div class="buttons">
<a href="#articles" class="btn">Explore My Work →</a>
<a href="#" class="ghost">▶ Watch Intro</a>
</div>

</div>

</section>

</body>
</html>
