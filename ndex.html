
<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial, sans-serif;
  background:#050505;
  color:white;
}
header{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 30px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
}
.logo{
  font-size:28px;
  font-weight:bold;
}
.logo span{color:#D90429}
nav a{

  margin-left:20px;
}
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:120px 8%;

}
.text{max-width:550px}
.text h1{
  font-size:72px;
  line-height:1;
}
.text h1 span{color:#D90429}
.text h3{
  margin:20px 0;
  font-weight:normal;
}
.btn{
  display:inline-block;
  margin-top:20px;
  background:#D90429;
  color:white;
  padding:14px 28px;
  border-radius:50px;
  text-decoration:none;
}
.photo img{
  width:360px;
  border-radius:24px;
  box-shadow:0 0 60px rgba(255,180,80,.35);
}
</style>
</head>

<body>

<header>

<section class="hero">

<div class="text">
